<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TechVault Desktop Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sticky Top Desktop Navbar -->
  <header class="main-header">
    <div class="logo" aria-hidden="false">TechVault</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="#">Categories</a>
      <a href="#">My Orders</a>
    </nav>
    <div class="cart-icon-container">
      <a href="checkout.html" id="cart-btn" class="cart-btn" aria-label="View cart">
        🛒 Cart (<span id="cart-count">0</span>)
      </a>
    </div>
  </header>

  <!-- Main Desktop Grid Section -->
  <main class="container">
    <h2>Featured Desktop Products</h2>
    <div id="product-grid" class="grid-layout">
      <!-- JavaScript will inject individual product cards right here -->
    </div>
  </main>

  <script src="catalog.js"></script>
</body>
</html>
